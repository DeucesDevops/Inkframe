# ExternalSecret pulls RDS and Redis credentials from AWS Secrets Manager
# and creates a native Kubernetes Secret consumed by the server deployment.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: inkframe-app-secrets
  namespace: inkframe
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: inkframe-app-secrets
    creationPolicy: Owner
  data:
    # RDS – full connection URL injected directly as DATABASE_URL
    - secretKey: DATABASE_URL
      remoteRef:
        key: inkframe-production/rds/master-password  # matches aws_secretsmanager_secret.db.name
        property: url

    # Redis – full connection URL injected as REDIS_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: inkframe-production/elasticache/auth-token  # matches aws_secretsmanager_secret.redis.name
        property: url
---
# ExternalSecret pulls static app secrets (JWT, third-party API keys) from
# AWS Secrets Manager. Store these once manually:
#   aws secretsmanager create-secret \
#     --name inkframe-production/app/static-secrets \
#     --secret-string '{"JWT_SECRET":"...","GEMINI_API_KEY":"...","STRIPE_SECRET_KEY":"..."}'
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: inkframe-static-secrets
  namespace: inkframe
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: inkframe-static-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: inkframe-production/app/static-secrets
        property: JWT_SECRET

    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: inkframe-production/app/static-secrets
        property: GEMINI_API_KEY

    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: inkframe-production/app/static-secrets
        property: STRIPE_SECRET_KEY
