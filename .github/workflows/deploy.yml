name: Deploy

on:
  push:
    branches: [main]
    # Don't re-trigger on the kustomization.yaml image-tag commits pushed by
    # this workflow itself (GITHUB_TOKEN pushes don't create workflow runs,
    # but this guard is kept for clarity).
    paths-ignore:
      - k8s/kustomization.yaml
  workflow_dispatch:
    inputs:
      skip_migration:
        description: Skip Prisma migration job
        type: boolean
        default: false

# Only one deploy runs at a time; do not cancel an in-flight deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write        # OIDC → AWS
  contents: write        # push kustomization.yaml image-tag updates back to repo
  security-events: write # upload Trivy SARIF results to GitHub Security tab

env:
  AWS_REGION:       ${{ vars.AWS_REGION }}
  ECR_REGISTRY:     ${{ vars.ECR_REGISTRY }}      # e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE:    inkframe
  IMAGE_TAG:        ${{ github.sha }}

jobs:
  # ─── Build & Push ─────────────────────────────────────────────────────────
  build-and-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [client, server]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/inkframe/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─── Trivy Security Scan ──────────────────────────────────────────────────
  # Scans every pushed image for CRITICAL/HIGH CVEs before any deployment.
  # Results upload to GitHub Security → Code scanning alerts tab.
  # The migrate and deploy jobs will not run if this fails.
  trivy-scan:
    name: Trivy scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-and-push
    strategy:
      fail-fast: false   # scan both images, not just until the first failure
      matrix:
        service: [client, server]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo $IMAGE_TAG | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Scan ${{ matrix.service }} for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/inkframe/${{ matrix.service }}:sha-${{ steps.sha.outputs.short }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ─── Migrate ──────────────────────────────────────────────────────────────
  migrate:
    name: Run Prisma migrations
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: ${{ !inputs.skip_migration }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name   "$EKS_CLUSTER_NAME"

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo $IMAGE_TAG | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Delete previous migration job (if any)
        run: |
          kubectl delete job prisma-migrate \
            --namespace "$K8S_NAMESPACE" \
            --ignore-not-found

      - name: Apply migration job with current image
        run: |
          sed "s|inkframe/server:latest|$ECR_REGISTRY/inkframe/server:sha-${{ steps.sha.outputs.short }}|g" \
            k8s/db-migration-job.yaml | kubectl apply -f -

      - name: Wait for migration to complete
        run: |
          kubectl wait job/prisma-migrate \
            --namespace "$K8S_NAMESPACE" \
            --for=condition=complete \
            --timeout=120s

      - name: Print migration logs
        if: always()
        run: |
          kubectl logs job/prisma-migrate \
            --namespace "$K8S_NAMESPACE" || true

  # ─── GitOps Update ────────────────────────────────────────────────────────
  # Commits updated image tags to kustomization.yaml → ArgoCD detects the
  # change and syncs the cluster automatically (no direct kubectl apply).
  gitops-update:
    name: Update kustomization & sync ArgoCD
    runs-on: ubuntu-latest
    needs: [trivy-scan, migrate]
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          # Use GITHUB_TOKEN — pushes from it don't re-trigger workflows.
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo $IMAGE_TAG | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Update image tags in kustomization.yaml
        working-directory: k8s
        run: |
          kustomize edit set image \
            inkframe/server=${{ env.ECR_REGISTRY }}/inkframe/server:sha-${{ steps.sha.outputs.short }} \
            inkframe/client=${{ env.ECR_REGISTRY }}/inkframe/client:sha-${{ steps.sha.outputs.short }}

      - name: Commit and push image-tag update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          # Exit cleanly if nothing changed (re-run of the same SHA)
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(deploy): bump images to sha-${{ steps.sha.outputs.short }}"
          # Rebase in case a concurrent job pushed ahead of us
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name   "$EKS_CLUSTER_NAME"

      - name: Wait for ArgoCD to roll out server
        run: |
          # ArgoCD syncs automatically when it detects the commit.
          # We verify completion here via kubectl rollout status (up to 5 min).
          kubectl rollout status deployment/server \
            --namespace "$K8S_NAMESPACE" \
            --timeout=300s

      - name: Wait for ArgoCD to roll out client
        run: |
          kubectl rollout status deployment/client \
            --namespace "$K8S_NAMESPACE" \
            --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods    --namespace "$K8S_NAMESPACE" -o wide
          kubectl get ingress --namespace "$K8S_NAMESPACE"
          kubectl get hpa     --namespace "$K8S_NAMESPACE"
